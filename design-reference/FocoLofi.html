<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1194, "height": 834}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { running: false, preset: 0, left: 25 * 60, anim: true }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.running && this.state.left > 0) this.setState({ left: this.state.left - 1 });
      else if (this.state.running) this.setState({ running: false });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const P = [[25, 5], [50, 10], [90, 15]];
    const total = P[this.state.preset][0] * 60;
    const left = this.state.left;
    const mm = String(Math.floor(left / 60)).padStart(2, '0');
    const ss = String(left % 60).padStart(2, '0');
    const C = 2 * Math.PI * 176;
    const presets = P.map((p, i) => ({ label: p[0] + ' / ' + p[1] + ' min', pressed: i === this.state.preset ? 'true' : 'false',
      pick: () => this.setState({ preset: i, left: p[0] * 60, running: false }),
      style: 'height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; '
        + (i === this.state.preset ? 'background: #FFFFFF; color: #1F2A33; border: 1px solid #FFFFFF' : 'background: transparent; color: #C2CFD8; border: 1px solid #3E5566') }));
    const rnd = (i, s) => { const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
    const dust = Array.from({ length: 34 }, (_, i) => { const s = (1.5 + rnd(i, 1) * 3).toFixed(1); return 'position: absolute; left: ' + (rnd(i, 2) * 100).toFixed(1) + '%; top: ' + (70 + rnd(i, 3) * 30).toFixed(1) + '%; width: ' + s + 'px; height: ' + s + 'px; border-radius: 999px; background: rgba(246,227,200,0.9); animation: lanima-rise ' + (14 + rnd(i, 4) * 12).toFixed(1) + 's linear ' + (-rnd(i, 5) * 20).toFixed(1) + 's infinite'; });
    const B = [[0,140,90],[70,110,150],[160,90,110],[230,160,200],[360,100,130],[440,130,90],[560,150,170],[690,90,120],[760,120,210],[870,140,140],[990,110,100],[1080,120,180]];
    const windows = [];
    B.forEach((b, j) => { for (let k = 0; k < 6; k++) { if (rnd(j * 10 + k, 6) < 0.45) continue;
      windows.push('position: absolute; left: ' + (b[0] + 14 + (k % 3) * Math.max(16, (b[1] - 28) / 3)).toFixed(0) + 'px; bottom: ' + (b[2] - 30 - Math.floor(k / 3) * 34) + 'px; width: 9px; height: 12px; border-radius: 2px; background: #F7E38A; animation: lanima-twinkle ' + (3 + rnd(j * 10 + k, 7) * 5).toFixed(1) + 's ease-in-out ' + (-rnd(j * 10 + k, 8) * 6).toFixed(1) + 's infinite'); } });
    const layers = { dust, windows };
    return {
      anim: this.state.anim, animPressed: this.state.anim ? 'true' : 'false',
      toggleAnim: () => this.setState({ anim: !this.state.anim }),
      knob: 'width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; transition: transform 200ms; transform: translateX(' + (this.state.anim ? '18px' : '0') + ')',
      track: 'width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; display: flex; box-sizing: border-box; background: ' + (this.state.anim ? '#F6BACB' : 'rgba(255,255,255,0.18)'),
      layers,
      time: mm + ':' + ss, running: this.state.running, paused: !this.state.running,
      playLabel: this.state.running ? 'Pausar' : 'Iniciar',
      dash: String(C), offset: String(C * (1 - left / total)),
      toggle: () => this.setState({ running: !this.state.running }),
      reset: () => this.setState({ running: false, left: total }),
      skip: () => this.setState({ running: false, left: 0 }),
      presets,
    };
  }
}
</script>
