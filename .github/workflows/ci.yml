name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supabase services the app doesn't use (yet): skipped to start faster.
env:
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  database:
    name: Banco de dados (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Applies supabase/migrations and supabase/seed.sql to a fresh local stack.
      - run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - run: npm run test:db

  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebKit (iPad e iPhone)
            browser: webkit
            projects: --project=ipad-landscape --project=ipad-portrait --project=iphone
          - name: Chromium (Galaxy Tab e Android)
            browser: chromium
            projects: --project=galaxy-tab-landscape --project=galaxy-tab-portrait --project=android-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local Supabase (Auth, database, Storage, Mailpit): E2E never touches a hosted project.
      - run: npx supabase start -x "$SUPABASE_EXCLUDE"
      # Browser binaries are cached per Playwright version (from the lockfile). System packages and
      # the download are separate steps with their own limits: a stuck mirror or CDN fails in
      # minutes, and the log shows which of the two hung (a run once sat 17+ min in one step).
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install system packages for ${{ matrix.browser }}
        run: npx playwright install-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - name: Download ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
        timeout-minutes: 10
      # The Playwright webServer runs `npm run build && next start` (production, service worker active)
      # with the local Supabase URL and key, read from `supabase status`.
      - run: npx playwright test ${{ matrix.projects }}
      # The focus themes on each device, to compare with design-reference/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-screenshots-${{ matrix.browser }}
          path: focus-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
