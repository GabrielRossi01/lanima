name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebKit (iPad e iPhone)
            browser: webkit
            projects: --project=ipad-landscape --project=ipad-portrait --project=iphone
          - name: Chromium (Galaxy Tab e Android)
            browser: chromium
            projects: --project=galaxy-tab-landscape --project=galaxy-tab-portrait --project=android-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The Playwright webServer runs `npm run build && next start` (production, service worker active).
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
